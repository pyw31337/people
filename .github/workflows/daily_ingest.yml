name: 24/7 Daily Global People & Photo Ingestion

on:
  schedule:
    # 매일 한국시간 오전 05:00 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily People Ingest
        run: |
          python3 scripts/daily_people_collector.py

      - name: Commit & Push Incremental Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-ingest): 24/7 daily people update $(date -u +'%Y-%m-%d')" && git push origin main)
